openapi: '3.0.3'
info:
  title: OORT Agent SDK Interface
  description: Client interface to the OORT agent.
  contact:
      name: Spire Global, Inc.
      url: https://developers.spire.com/oort-docs/index.html
  version: '1.5'
servers:
  - url: http://localhost:2005/sdk/v1
paths:
  /tfrs:
    get:
      tags:
        - sdk
      description: get tfrs values
      operationId: get_tfrs
      responses:
        '200':
          description: OK
          content:
            "application/json":
              schema:
                "$ref": "adcs-schema.yml#/components/schemas/TfrsResponse"
  /adcs:
    get:
      tags:
        - sdk
      description: query adcs status
      operationId: get_adcs
      responses:
        '200':
          description: OK
          content:
            "application/json":
              schema:
                "$ref": "adcs-schema.yml#/components/schemas/AdcsResponse"

    post:
      tags:
        - sdk
      description: request adcs operation
      operationId: command_adcs
      requestBody:
        description: The file and parameters for sending
        required: true
        content:
          "application/json":
            schema:
              "$ref": "adcs-schema.yml#/components/schemas/AdcsCommandRequest"
      responses:
        '200':
          description: OK
          content:
            "application/json":
              schema:
                "$ref": "adcs-schema.yml#/components/schemas/AdcsCommandResponse"
        '400':
          description: ERROR
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"

  /send_file:
    description: Send a file to a destination
    post:
      tags:
        - sdk
      operationId: send_file
      requestBody:
        description: The file and parameters for sending
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/SendFileRequest"
      responses:
        '200':
          description: OK
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SendFileResponse"
        '400':
          description: Bad request
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"


  /query_available_files/{topic}:
    description: Query the Transfer Agent for files available for retrieval
    parameters:
      - name: topic
        in: path
        required: true
        schema:
          type: string
          pattern: "^[-_A-Za-z0-9]+$"
    get:
      tags:
        - sdk
      operationId: query_available_files
      responses:
        '200':
          description: OK
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AvailableFilesResponse"

  /retrieve_file:
    description: >
      Instruct the transfer agent to move a received file to a destination.
      The data file is moved to the requested destination; the file metadata
      is returned as the response body.
    post:
      tags:
        - sdk
      operationId: retrieve_file
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RetrieveFileRequest"
      responses:
        '200':
          description: OK
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/FileInfo"
        '400':
          description: Bad request
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"

components:
  schemas:
    TTLParams:
      description: TTL parameters for a sent item
      properties:
        urgent:
          type: integer
          description: TTL in seconds for urgent items
          default: 9000
        bulk:
          type: integer
          description: TTL in seconds for bulk items
          default: 43200
        surplus:
          type: integer
          description: TTL in seconds for surplus items
          default: 172800
      x-example-json: >
        {
          "urgent": 100,
          "bulk": 200,
          "surplus": 300
        }

    DeliveryHints:
      description: Delivery hints used to inform the reveiver about the expected destination of the file
      required: [dest_path, mode]
      additionalProperties:
        type: string
      properties:
        dest_path:
          type: string
          description: Path of the file on the destination filesystem
        mode:
          type: string
          description: >
            File mode in octal form. For example: "760" means that the user
            can read+write+execute, the group can read+write, and others have no access
      x-example-json: >
        {
          "dest_path": "/foo/bar",
          "mode": "640",
          "an": "additionalProperty"
        }

    Tags:
      description: a structure for optional file tags
      additionalProperties:
        type: string
      x-example-json: >
        {
          "foo": "bar",
          "thud": "quux"
        }

    SendOptions:
      description: options to apply to a send request
      properties:
        TTLParams:
          "$ref": "#/components/schemas/TTLParams"
        reliable:
          type: boolean
          description: whether to send an item reliably, i.e., with retries
          default: true
        tags:
            "$ref": "#/components/schemas/Tags"
        delivery_hints:
            "$ref": "#/components/schemas/DeliveryHints"
      x-example-json: >
        {
          "TTLParams": {
            "urgent": 100,
            "bulk": 200,
            "surplus": 300
          },
          "reliable": true,
          "tags": {
            "foo": "bar",
            "thud": "quux"
          },
          "delivery_hints": {
            "dest_path": "/foo/bar",
            "mode": "640",
            "an": "additionalProperty"
          }
        }

    SendFileRequest:
      x-body-name: send_file_request
      required: [destination, filepath, topic]
      properties:
        destination:
          type: string
          description: the destination to send the file to
        filepath:
          type: string
          description: The source filepath.  Must be an absolute path.
          pattern: "^/.*"
        topic:
          type: string
          description: the pipeline topic to send the file to
        options:
          "$ref": "#/components/schemas/SendOptions"
      x-example-json: >
        {
          "destination": "ground",
          "filepath": "/mnt/sd1/foo/bar",
          "topic": "the quick brown fox who jumped over the lazy dog",
          "options": {
            "TTLParams": {
              "urgent": 100,
              "bulk": 200,
              "surplus": 300
            },
            "reliable": true,
            "tags": {
              "foo": "bar",
              "thud": "quux"
            },
            "delivery_hints": {
              "dest_path": "/foo/bar",
              "mode": "640",
              "an": "additionalProperty"
            }
          }
        }

    SendFileResponse:
      description: Response to a send file request
      type: object
      required: [UUID]
      properties:
        UUID:
          type: string
          format: UUID
      x-example-json: >
        {
          "UUID": "b071ca24-29a5-11f1-9d99-00155d2f52cc"
        }

    FileInfo:
      type: object
      description: Information about the file and the transfer request.
      required: [id, path, size, modified, created, crc32]
      properties:
        id:
          type: string
          format: UUID
        path:
          type: string
        size:
          type: integer
          format: int64
        modified:
          type: integer
          format: int64
        created:
          type: integer
          format: int64
        crc32:
          type: string
        extra:
          type: object
          additionalProperties:
              type: string
        delivery_hints:
            "$ref": "#/components/schemas/DeliveryHints"
      x-example-json: >
        {
          "id": "b071ca24-29a5-11f1-9d99-00155d2f52cc",
          "path": "/mnt/sd1/foo/bar",
          "size": 100,
          "modified": 1774592815,
          "created": 1774592814,
          "crc32": "1A2B3C4D",
          "extra": {
            "just": "a",
            "couple": "of",
            "example": "tags"
          },
          "delivery_hints": {
            "dest_path": "/foo/bar",
            "mode": "640",
            "an": "additionalProperty"
          }
        }

    AvailableFilesResponse:
      title: AvailableFilesResponse
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileInfo"
        overflow:
          type: boolean
          description: true if there are more files available than could be returned in this call
      x-example-json: >
        {
          "files": [
            {
              "id": "b071ca24-29a5-11f1-9d99-00155d2f52cc",
              "path": "/mnt/sd1/foo/bar",
              "size": 100,
              "modified": 1774592815,
              "created": 1774592814,
              "crc32": "1A2B3C4D",
              "extra": {
                "just": "a",
                "couple": "of",
                "example": "tags"
              },
              "delivery_hints": {
                "dest_path": "/foo/bar",
                "mode": "640",
                "an": "additionalProperty"
              }
            }
          ],
          "overflow": false
        }

    RetrieveFileRequest:
      x-body-name: retrieve_request
      type: object
      required: [id, save_path]
      properties:
        id:
          type: string
          format: UUID
        save_path:
          type: string
          description: The destination path to save the file. Must be an absolute path.
          pattern: "^/.*"
      x-example-json: >
        {
          "id": "b071ca24-29a5-11f1-9d99-00155d2f52cc",
          "save_path": "/shave/the/whales"
        }


    ErrorResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: integer
        message:
          type: string
      x-example-json: >
        {
          "status": 500,
          "message": "yikes"
        }
